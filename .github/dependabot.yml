version: 2

updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 20
  assignees:
  - TC-SJ-Yoon
  # Collapse minor + patch gem bumps into one PR; majors stay individual (LEN-616).
  groups:
    minor-and-patch:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
