coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        # Strict: lib coverage is 100%, so any drop should fail (LEN-670). The
        # one-time simplecov-1.0 re-baseline that needed a temporary threshold
        # has landed on master.
        threshold: 0%
    patch:
      default:
        target: auto
        informational: true

comment:
  layout: "reach,diff,flags,tree"
  require_changes: no
